<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"/><meta name="theme-color" content="#142119"/><meta name="description" content="ZNAQ — единая платформа для деклараций, документов сертификации и маркировки. Точность имеет знак."/><meta name="application-name" content="ZNAQ"/><title>ZNAQ — платформа соответствия</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<script>
(function(){
  var palettes=/* theme-canvases */{};
  var preference='system',palette='znaq';
  try{preference=localStorage.getItem('certflow.theme');var saved=localStorage.getItem('certflow.color-theme');if(Object.prototype.hasOwnProperty.call(palettes,saved))palette=saved;}catch{}
  var mode=preference==='light'||preference==='dark'?preference:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var root=document.documentElement;root.dataset.theme=mode;root.dataset.colorTheme=palette;root.classList.toggle('dark',mode==='dark');root.style.colorScheme=mode;var canvas=palettes[palette][mode==='dark'?1:0];root.style.setProperty('--canvas',canvas);document.querySelector('meta[name=theme-color]').content=canvas;
})();
</script>
<style>html{background:var(--canvas,#f3f5f0)}</style></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
